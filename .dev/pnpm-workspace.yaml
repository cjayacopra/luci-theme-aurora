# ShiranekoWrt: this theme ships OUR tokens, not upstream's.
#
# The @eamonxg/luci-theme-tokens npm package is the UPSTREAM release (2.0.0,
# no shiranekowrt preset, no setguard operator). This repo's branding branch
# must render with OUR tokens (shiranekowrt preset, setguard, v3.0.0), which
# only the ShiranekoWrt fork carries. Link the fork's tokens subpackage as the
# package source so pnpm never resolves the upstream npm package.
#
# The fork moved to a monorepo (packages/tokens); its dist/ is gitignored and
# built on demand (node build.mjs in packages/tokens). The declared version in
# package.json must stay in sync with the fork's package.json (currently 3.0.0).
overrides:
  '@eamonxg/luci-theme-tokens': link:../../luci-theme-tokens/packages/tokens

allowBuilds:
  esbuild: true
