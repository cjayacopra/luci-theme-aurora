<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .line { fill: none; stroke: #f0f0f0; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thinline { fill: none; stroke: #f0f0f0; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #0a0a0a; stroke: #f0f0f0; stroke-width: 6; }
      .nodefill { fill: #f0f0f0; }
    </style>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- rounded-corner dark background -->
    <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#0a0a0a"/>

    <!-- cat artwork, scaled to fill the full canvas -->
    <g transform="translate(-59.077,-32.923) scale(1.23077)">

      <!-- cat head: rounded square-ish silhouette outline -->
      <path class="line" d="
        M 176 168
        L 150 96
        L 210 132
        Q 256 118 302 132
        L 362 96
        L 336 168
        Q 366 200 366 248
        Q 366 336 256 336
        Q 146 336 146 248
        Q 146 200 176 168
        Z" />

      <!-- inner ear notches -->
      <path class="thinline" d="M 178 150 L 188 122" />
      <path class="thinline" d="M 334 150 L 324 122" />

      <!-- eyes -->
      <circle class="nodefill" cx="212" cy="230" r="7"/>
      <circle class="nodefill" cx="300" cy="230" r="7"/>

      <!-- nose -->
      <path class="line" d="M 246 252 L 266 252 L 256 264 Z" />

      <!-- whiskers left, doubling as circuit traces with nodes -->
      <path class="thinline" d="M 176 258 L 110 246 L 78 246" />
      <circle class="node" cx="78" cy="246" r="8"/>
      <path class="thinline" d="M 172 274 L 104 282 L 72 282" />
      <circle class="node" cx="72" cy="282" r="8"/>

      <!-- whiskers right, mirrored circuit traces -->
      <path class="thinline" d="M 336 258 L 402 246 L 434 246" />
      <circle class="node" cx="434" cy="246" r="8"/>
      <path class="thinline" d="M 340 274 L 408 282 L 440 282" />
      <circle class="node" cx="440" cy="282" r="8"/>

      <!-- tail: sweeps out from body and resolves into a circuit trace with nodes -->
      <path class="line" d="
        M 306 328
        Q 366 340 388 300
        Q 404 270 388 236
        L 388 200" />
      <path class="thinline" d="M 388 200 L 420 200" />
      <circle class="node" cx="420" cy="200" r="8"/>
      <path class="thinline" d="M 404 236 L 434 236" />
      <circle class="node" cx="434" cy="236" r="8"/>

      <!-- small circuit branch under chin -->
      <path class="thinline" d="M 256 336 L 256 366 L 226 366" />
      <circle class="node" cx="226" cy="366" r="8"/>
      <path class="thinline" d="M 256 366 L 286 366" />
      <circle class="node" cx="286" cy="366" r="8"/>

    </g>
  </g>
</svg>
